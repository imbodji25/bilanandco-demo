<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démonstration Bilan&Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --encre:#0F120D; --second:#6B6F6A; --tertiaire:#8A8F86; --filet:#E4E6E1; --filet2:#D5DAD0;
  --os:#EDEEEA; --fond:#F3F4F1; --blanc:#FFFFFF; --vert:#A8E05F; --vert-texte:#1E7A3B;
  --ambre:#8A5A12; --rouge:#C42F37;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:21px;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button,select{font:inherit;color:inherit}
.bar{display:block;overflow:hidden;min-width:0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--blanc);border-bottom:1px solid var(--filet);flex:0 0 auto}
.sep{flex-basis:100%;height:0}
.bas{display:none}
/* toutes les commandes tiennent dans les 820 premiers pixels : un cadre d'affichage
   plus étroit que la page ne peut donc jamais en couper une */
.inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:820px;min-width:0}
.marque{flex:0 0 auto}
.fil{flex:1 1 120px}
.marque{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;letter-spacing:-.2px}
.pastille{width:22px;height:14px;border-radius:7px;background:var(--encre);position:relative;flex:0 0 auto}
.pastille::after{content:"";position:absolute;right:0;top:0;width:11px;height:14px;border-radius:7px;background:var(--vert)}
label.ch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--second);white-space:nowrap}
select{height:40px;padding:0 12px;border:1px solid var(--filet2);border-radius:20px;background:var(--blanc);
  max-width:190px;font-size:13px;cursor:pointer}
.b{height:40px;padding:0 14px;border:1px solid var(--encre);border-radius:20px;background:var(--blanc);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.b.p{border:0;background:var(--vert)}
.b:disabled{border-color:var(--filet2);color:var(--tertiaire);cursor:not-allowed}
.b.icone{width:40px;padding:0;border-color:var(--filet2);font-size:16px}
.vide{display:none}
main{flex:1 1 auto;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:20px 16px 28px;overscroll-behavior:contain}
#cadre{background:var(--blanc);border:1px solid var(--filet);overflow:hidden;flex:0 0 auto}
#cadre.tel{border-radius:28px}
iframe{display:block;border:0}
.note{font-size:12px;line-height:18px;color:var(--second)}
.fil{flex:1 1 180px;min-width:0;font-size:12px;color:var(--tertiaire);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#journal{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--blanc);
  border-left:1px solid var(--filet);display:none;flex-direction:column;z-index:20}
#journal.ouvert{display:flex}
#journal header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--filet)}
#lignes{flex:1 1 auto;overflow:auto;padding:0 16px 16px}
#lignes div{padding:9px 0;border-bottom:1px solid var(--filet);font-size:13px;line-height:19px}
#lignes .q{font-size:11px;color:var(--tertiaire)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:min(560px,92vw);
  background:var(--blanc);border:1px solid var(--filet2);border-radius:14px;padding:12px 16px;
  display:none;z-index:30}
#toast.vu{display:block}
#toast strong{display:block;font-size:14px;line-height:20px}
@media (max-width:1280px){
  .fil{display:none}
  .bar{gap:8px;padding-top:6px;padding-bottom:6px}
  select{height:40px;max-width:150px;font-size:13px}
  .b{height:40px;padding:0 13px;font-size:13px}
  .b.icone{width:40px;padding:0}
  label.ch{gap:4px}
  main{padding:12px 8px 20px}
}
@media (max-width:760px){
  .marque span{display:none}
  label.ch span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  label.ch{flex:1 1 calc(50% - 6px);min-width:0}
  label.ch select{width:100%;max-width:none}
  .vide{display:none}
  #journal{width:100%;border-left:0}
  .note{flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sep{display:none}
  .bas label.ch{flex:0 0 auto}
  .bas label.ch select{width:auto;max-width:132px}
}
</style>

</head>
<body>
<div class="bar"><div class="inner">
  <span class="marque"><span class="pastille"></span><span>Bilan&amp;Co · démonstration</span></span>
  <label class="ch">Rôle <select id="roles" aria-label="Rôle simulé"></select></label>
  <label class="ch">Écran <select id="ecran"></select></label>
  <label class="ch">État <select id="etat"></select></label>
  <button class="b" id="echelle" title="Ajuster la planche à la fenêtre ou la voir à sa taille réelle">
    <span class="mono" id="zoom">100 %</span></button>
  <button class="b icone" id="retour" title="Écran précédent" aria-label="Écran précédent">←</button>
  <button class="b" id="ouvrirJournal"><span class="lbl">Journal</span> <span class="mono" id="compteur">0</span></button>
  <span class="sep" aria-hidden="true"></span>

  <label class="ch">Parcours <select id="parcours"></select></label>
  <button class="b" id="prec">Précédent</button>
  <button class="b p" id="suiv">Étape suivante</button>
  <span class="mono" id="pas" style="font-size:12px;color:var(--second)"></span>
  <span class="note" id="consigne"></span>

  <span class="fil" id="fil"></span>
</div></div>

<main><div id="cadre"><iframe id="vue" title="Écran de démonstration"></iframe></div></main>



<div id="journal" aria-label="Journal de vérification des clics">
  <header><strong style="flex-grow:1">Journal des clics</strong>
    <button class="b" id="exporter">Copier</button>
    <button class="b icone" id="fermerJournal" aria-label="Fermer">×</button></header>
  <div id="lignes"></div>
</div>

<div id="toast" role="status"></div>

const PARCOURS = [{"titre": "1 · Acquisition et ouverture d’un dossier", "pas": [{"n": "Site", "c": "Le visiteur arrive sur bilanandco.com."}, {"n": "ExpertComptable", "c": "Page cabinet : l’appel à l’action mène à la création de compte."}, {"n": "ContactCabinet", "c": "Variante : prise de rendez-vous, avec nombre de dossiers et logiciel actuel."}, {"n": "Inscription1", "c": "Création du compte cabinet."}, {"n": "Main", "c": "Portefeuille du cabinet. Le bouton « Nouveau dossier » ouvre l’étape suivante."}, {"n": "DosNouveau", "c": "Étape 1 sur 3 : identité, NINEA 005 412 873, RCCM SN-THS-2019-B-412, exercice."}, {"n": "DosConfiguration", "c": "Étape 2 sur 3 : régimes fiscaux sénégalais et canaux de collecte."}, {"n": "DosInvitation", "c": "Étape 3 sur 3 : code NDIAYE-7K2P, trois invités, message WhatsApp."}, {"n": "EntConnexion", "c": "Côté cliente : connexion par le code reçu sur le téléphone."}, {"n": "EntBureau", "c": "Même espace ouvert sur ordinateur."}]}, {"titre": "2a · Production : valider et enchaîner", "pas": [{"n": "Pieces", "c": "File des pièces à traiter du dossier."}, {"n": "Traitement", "c": "Imputation d’une pièce. Branche « Valider et suivant → »."}, {"n": "Traitement-Suivante", "c": "VAL-PIE-087 : écriture verrouillée, correction par contrepassation. Pièce suivante déjà chargée."}, {"n": "Traitement-Fin", "c": "Fin de file : quatre pièces en neuf minutes, état vide « Toutes les pièces ont été traitées »."}]}, {"titre": "2b · Production : demander un complément", "pas": [{"n": "Pieces", "c": "Même point de départ."}, {"n": "Traitement", "c": "Branche « Demander un complément » cette fois."}, {"n": "Traitement-Complement", "c": "Choix du motif parmi cinq, commentaire, envoi par WhatsApp."}, {"n": "EntMessages", "c": "La demande arrive dans la messagerie de la cliente."}, {"n": "EntPieces-ActionRequise", "c": "La pièce bascule en « Action requise » : PIE-ETA-004, ambre."}]}, {"titre": "3 · Révision, TVA et visa", "pas": [{"n": "DosTVA", "c": "Comptes 443100 et 445100. « Valider la déclaration » est désarmé par ERR-PER-021 et ERR-LET-044 : essayez le bouton, puis l’état « anomalies levées »."}, {"n": "RevisionControle", "c": "Cycle B1 : écart de 17 500 FCFA, bandeau ambre AVT-REV-B1-017."}, {"n": "RevisionControle-Valide", "c": "Après justification : bandeau vert, écart nul, contrôle validé."}, {"n": "RevisionSynthese", "c": "Synthèse des cycles de révision."}, {"n": "DosRapportEditeur", "c": "Éditeur de plaquette : le visa ne s’appose qu’une fois les contrôles validés."}]}, {"titre": "5 · Back-office : instruire une demande d’inscription", "pas": [{"n": "Inscription1", "c": "Un cabinet crée son compte depuis le site public."}, {"n": "ContactCabinet", "c": "Ou demande une démonstration : les deux arrivent dans la même file."}, {"n": "AdminConnexion", "c": "Connexion interne : adresse @bilanandco.com et code à six chiffres."}, {"n": "AdminTableauBord", "c": "Vue d’ensemble : 12 cabinets, 318 dossiers, 25 370 pièces, santé des services."}, {"n": "AdminCabinets", "c": "Deux demandes attendent la vérification de l’inscription à l’Ordre (ADM-ORD-014)."}, {"n": "AdminCabinetDetail", "c": "Instruction : ONECCA, NINEA, RCCM, quota, piste d’audit."}, {"n": "AdminAbonnements", "c": "Offres identiques à la page Tarifs, essais en cours, impayé à relancer."}, {"n": "AdminReferentiels", "c": "Règles partagées : les barèmes sociaux non validés sont bloqués (ADM-REF-077)."}, {"n": "AdminSupportSupervision", "c": "File de support, incidents ERR-ENV-*, accès d’assistance en lecture seule."}]}];
const ROLES = [
  ['site','Visiteur du site'],
  ['cabinet','Cabinet · expert-comptable'],
  ['mobile','Entreprise · téléphone'],
  ['bureau','Entreprise · ordinateur'],
  ['admin','Back-office Bilan&Co']
];
const DEPART = {site:'Site',cabinet:'Main',mobile:'EntAccueil',bureau:'EntBureau',admin:'AdminConnexion'};
let role='site', courant=null, pile=[], journal=[], parcours=null, pas=0;

const $ = s => document.querySelector(s);
const noms = Object.keys(CAT);

// ----------------------------------------------------------------- rôles
$('#roles').innerHTML = ROLES.map(([k,l]) =>
  `<option value="${k}"${k===role?' selected':''}>${l}</option>`).join('');
$('#roles').addEventListener('change', e => {
  role = e.target.value;
  remplirEcrans();
  aller(DEPART[role], 'sélecteur de rôle');
});

function espaceDe(n){ return CAT[n].e === 'acces' ? (role==='mobile'?'mobile':'cabinet') : CAT[n].e; }

function remplirEcrans(){
  const liste = noms.filter(n => CAT[n].e === role || (CAT[n].e==='acces' && (role==='cabinet'||role==='mobile'||role==='admin')))
                    .sort((a,b) => CAT[a].t.localeCompare(CAT[b].t,'fr'));
  $('#ecran').innerHTML = liste.map(n => `<option value="${n}">${CAT[n].t}</option>`).join('')
    + `<optgroup label="Tous les écrans">` +
    noms.slice().sort((a,b)=>CAT[a].t.localeCompare(CAT[b].t,'fr'))
      .map(n=>`<option value="${n}">${CAT[n].t}</option>`).join('')
    + `</optgroup>`;
}

// ----------------------------------------------------------- états d'écran
function variantes(n){
  const base = CAT[n].b || n;
  const v = [[base, 'Nominal']];
  noms.filter(x => CAT[x].b === base).forEach(x => {
    v.push([x, CAT[x].t.split('·').slice(1).join('·').trim() || x.slice(base.length+1)]);
  });
  return v;
}
function remplirEtats(){
  const v = variantes(courant);
  const dispo = v.length > 1;
  $('#etat').innerHTML = v.map(([n,l]) => `<option value="${n}"${n===courant?' selected':''}>${l}</option>`).join('')
    + `<option value="__leve">Simulation · anomalies levées</option>`;
  $('#etat').disabled = false;
  $('#etat').title = dispo ? '' : 'Cet écran n’a pas de variante enregistrée';
}
$('#etat').addEventListener('change', e => {
  if(e.target.value === '__leve'){ leverAnomalies(); e.target.value = courant; return; }
  aller(e.target.value, 'sélecteur d’état');
});
$('#ecran').addEventListener('change', e => aller(e.target.value, 'sélecteur d’écran'));

// --------------------------------------------------------------- navigation
function aller(n, origine, sansPile){
  if(!CAT[n]) { toast('Écran inconnu', n); return; }
  if(courant && !sansPile) pile.push(courant);
  courant = n;
  const e = CAT[n].e;
  if(e !== 'acces' && e !== role && !(e==='bureau'&&role==='cabinet')) {
    role = (e==='acces') ? role : e;
    $('#roles').value = role;
    remplirEcrans();
  }
  $('#ecran').value = n;
  $('#vue').src = 'ecrans/' + n + '.dc.html';
  $('#fil').textContent = CAT[n].t + ' · ' + n;
  $('#retour').disabled = !pile.length;
  dimensionner();
  remplirEtats();
  if(origine) noter(n, origine, 'affichage de l’écran');
}
$('#retour').addEventListener('click', () => { const p = pile.pop(); if(p) aller(p,'bouton retour',true); });
$('#echelle').addEventListener('click', () => {
  echelle = echelle === 'ajuster' ? 'reelle' : 'ajuster';
  $('#echelle').setAttribute('aria-pressed', echelle === 'reelle');
  dimensionner();
  noter(courant, 'échelle', echelle === 'reelle' ? 'planche à sa taille réelle' : 'planche ajustée à la fenêtre');
});

function dimensionner(){
  const {w,h} = CAT[courant];
  const cadre = $('#cadre'), f = $('#vue');
  f.width = w; f.height = h;
  f.style.width = w+'px'; f.style.height = h+'px';
  cadre.classList.toggle('tel', w <= 400);
  const dispo = document.querySelector('main').clientWidth - 32;
  // « ajuster » met la planche à l'échelle de la fenêtre ; « 100 % » la laisse à sa taille
  const k = echelle === 'reelle' ? 1 : Math.min(1, dispo / w);
  f.style.transformOrigin = 'top left';
  f.style.transform = 'scale('+k+')';
  cadre.style.width = Math.round(w*k)+'px';
  cadre.style.height = Math.round(h*k)+'px';
  $('#zoom').textContent = k === 1 ? '100 %' : Math.round(k*100)+' %';
}
let echelle = 'ajuster';
addEventListener('resize', () => courant && dimensionner());

// ------------------------------------------------- interception dans l'écran
$('#vue').addEventListener('load', () => {
  const d = $('#vue').contentDocument; if(!d) return;
  // un bouton désarmé n'émettrait aucun clic : on garde son apparence et on explique
  d.querySelectorAll('[disabled]').forEach(x => {
    x.removeAttribute('disabled'); x.setAttribute('aria-disabled','true'); x.dataset.desarme = '1';
  });
  d.addEventListener('click', ev => {
    const a = ev.target.closest && ev.target.closest('a[href]');
    if(a){
      const h = a.getAttribute('href');
      if(/\.dc\.html$/.test(h)){ ev.preventDefault(); aller(h.replace('.dc.html',''), libelle(a)); return; }
      ev.preventDefault();
      const c = deduire(a);
      if(c){ aller(c, libelle(a)); return; }
      toast(libelle(a), 'Lien de démonstration : la maquette ne porte pas d’écran pour cette entrée.');
      noter(courant, libelle(a), 'accusé de démonstration'); return;
    }
    const b = ev.target.closest && ev.target.closest('button,[role="button"]');
    if(b){
      ev.preventDefault();
      if(b.getAttribute('role') === 'tab'){ onglet(b); return; }
      if(b.getAttribute('aria-disabled') === 'true' || b.disabled){
        toast(libelle(b), 'Commande désarmée par une anomalie bloquante. Le sélecteur « État » permet de la lever en simulation.');
        noter(courant, libelle(b), 'commande désarmée'); return;
      }
      const cible = deduire(b, d);
      if(cible){ aller(cible, libelle(b)); return; }
      toast(libelle(b), 'Commande de démonstration : la maquette ne porte pas encore d’écran pour cette action.');
      noter(courant, libelle(b), 'accusé de démonstration');
    }
  }, true);
});
function libelle(e){ return (e.textContent || e.getAttribute('aria-label') || 'contrôle').trim().slice(0,56) || 'contrôle'; }

function onglet(b){
  const liste = b.closest('[role="tablist"]'); if(!liste) return;
  [...liste.querySelectorAll('[role="tab"]')].forEach(t => {
    const actif = t === b;
    t.setAttribute('aria-selected', actif);
    t.style.background = actif ? '#0F120D' : 'transparent';
    t.style.color = actif ? '#FFFFFF' : '#0F120D';
  });
  noter(courant, libelle(b), 'onglet sélectionné');
}

// un bouton sans cible propre hérite de l'écran que son libellé désigne
const MOTS = [
  [/pièce|justificatif|dépôt/i, {cabinet:'Pieces', mobile:'EntPieces'}],
  [/tva|déclaration/i, {cabinet:'DosTVA', mobile:'EntAccueil'}],
  [/révision|contrôle/i, {cabinet:'Revision', mobile:'EntAccueil'}],
  [/balance/i, {cabinet:'DosBalance'}],
  [/grand livre|écriture/i, {cabinet:'DosGrandLivre'}],
  [/facture/i, {cabinet:'DosFacturation', mobile:'EntFactures'}],
  [/message|échange/i, {cabinet:'CabMessagerie', mobile:'EntMessages'}],
  [/dossier/i, {cabinet:'DosTableau'}],
  [/fonctionnalité/i, {site:'ProductionComptable', cabinet:'ProductionComptable'}],
  [/tarif|prix/i, {site:'Tarifs'}],
  [/sécurité|confidentialité|données personnelles/i, {site:'Confidentialite', cabinet:'Confidentialite'}],
  [/mentions légales/i, {site:'MentionsLegales'}],
  [/question|aide|tutoriel|assistance/i, {site:'Aide', cabinet:'Aide', mobile:'EntMessages'}],
  [/blog|article/i, {site:'Blog'}],
  [/démonstration|rendez-vous|nous écrire|contact/i, {site:'Contact', cabinet:'ContactCabinet'}],
  [/partager|document|ged/i, {cabinet:'CabGED', mobile:'EntPieces'}],
  [/trésorerie|banque|mobile money/i, {cabinet:'DosBanques', mobile:'EntTresorerie'}],
  [/frais|dépense/i, {cabinet:'DosFrais', mobile:'EntFrais'}],
  [/profil|compte|paramètre/i, {cabinet:'CabProfil', mobile:'EntProfil', admin:'AdminCabinetDetail'}],
  [/cabinet|inscription à l.ordre|onecca/i, {admin:'AdminCabinets'}],
  [/abonnement|facturation|offre|essai|consommation/i, {admin:'AdminAbonnements', cabinet:'CabAbonnement'}],
  [/référentiel|barème|plan comptable/i, {admin:'AdminReferentiels'}],
  [/support|incident|assistance|supervision/i, {admin:'AdminSupportSupervision'}]
];
function deduire(b, d){
  const t = libelle(b);
  for(const [re,c] of MOTS){
    if(re.test(t)){
      const n = c[espaceDe(courant)] || c.cabinet;
      if(n && CAT[n] && n !== courant) return n;
    }
  }
  return null;
}

function leverAnomalies(){
  const d = $('#vue').contentDocument; if(!d) return;
  let n = 0;
  d.querySelectorAll('[aria-disabled="true"],[disabled]').forEach(b => {
    b.disabled = false; b.removeAttribute('aria-disabled'); delete b.dataset.desarme;
    b.style.background = '#A8E05F'; b.style.color = '#0F120D'; b.style.cursor = 'pointer';
    n++;
  });
  d.querySelectorAll('[role="alert"]').forEach(a => {
    if(/ERR-|AVT-/.test(a.textContent)){ a.style.display = 'none'; n++; }
  });
  toast('Simulation · anomalies levées',
    n ? n + ' élément(s) modifié(s) : les commandes désarmées sont réarmées et les bandeaux bloquants masqués. La maquette d’origine est rétablie en rechargeant l’écran.'
      : 'Cet écran ne porte ni commande désarmée ni bandeau bloquant.');
  noter(courant, 'sélecteur d’état', 'anomalies levées en simulation');
}

// ------------------------------------------------------------------ parcours
$('#parcours').innerHTML = '<option value="">—</option>' +
  PARCOURS.map((p,i) => `<option value="${i}">${p.titre}</option>`).join('');
$('#parcours').addEventListener('change', e => {
  parcours = e.target.value === '' ? null : PARCOURS[+e.target.value];
  pas = 0;
  if(parcours) etape(0);
  else { $('#pas').textContent = ''; $('#consigne').textContent = '';
         $('#prec').disabled = true; $('#suiv').disabled = true; }
});
$('#suiv').addEventListener('click', () => parcours && etape(pas + 1));
$('#prec').addEventListener('click', () => parcours && etape(pas - 1));
function etape(k){
  if(!parcours) return;
  pas = Math.max(0, Math.min(k, parcours.pas.length - 1));
  const e = parcours.pas[pas];
  aller(e.n, 'parcours ' + parcours.titre);
  $('#pas').textContent = 'Étape ' + (pas+1) + ' / ' + parcours.pas.length;
  $('#consigne').textContent = e.c;
  $('#prec').disabled = pas === 0;
  $('#suiv').disabled = pas === parcours.pas.length - 1;
}

// ------------------------------------------------------------------- journal
function noter(ecran, controle, action){
  journal.push({h:new Date().toLocaleTimeString('fr-FR'), e:ecran, c:controle, a:action});
  $('#compteur').textContent = journal.length;
  const l = document.createElement('div');
  l.innerHTML = '<strong>' + controle + '</strong><br>' + action +
    '<span class="q"> · ' + ecran + ' · ' + journal[journal.length-1].h + '</span>';
  $('#lignes').prepend(l);
}
$('#ouvrirJournal').addEventListener('click', () => $('#journal').classList.add('ouvert'));
$('#fermerJournal').addEventListener('click', () => $('#journal').classList.remove('ouvert'));
$('#exporter').addEventListener('click', () => {
  const t = journal.map(x => [x.h,x.e,x.c,x.a].join(' · ')).join('\n');
  try{ navigator.clipboard.writeText(t); toast('Journal copié', journal.length + ' ligne(s) dans le presse-papiers.'); }
  catch(e){ toast('Copie indisponible', 'Le journal reste lisible dans ce panneau.'); }
});

let minuteur;
function toast(titre, texte){
  $('#toast').innerHTML = '<strong>' + titre + '</strong><span class="note">' + texte + '</span>';
  $('#toast').classList.add('vu');
  clearTimeout(minuteur); minuteur = setTimeout(() => $('#toast').classList.remove('vu'), 4200);
}

$('#prec').disabled = true; $('#suiv').disabled = true;   // sans parcours choisi
remplirEcrans();
aller('Site', null, true);
</script>
